<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahoo 股市更新助理</title>
  <meta name="description" content="定時抓取台灣股市特定股票資訊，包含股價、均線與財務指標。">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="股市助理">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-container">

    <!-- ── Header ─────────────────────────────────────────────────── -->
    <header class="header">
      <div class="header-brand">
        <img src="icons/icon-192.png" alt="App Icon" class="brand-icon" id="install-btn" title="安裝 App">
        <div class="brand-text">
          <h1>Yahoo 股市更新助理</h1>
          <span class="brand-sub">台灣股市監控 · PWA</span>
        </div>
      </div>

      <div class="header-controls">
        <span id="last-updated" class="last-updated">最後更新：-</span>

        <label class="auto-toggle" title="自動每 10 分鐘更新">
          <input type="checkbox" id="auto-update-check">
          <span class="auto-slider"></span>
          <span class="auto-label">自動</span>
        </label>

        <button id="manual-update-btn" class="btn primary" aria-label="手動更新資料">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
          手動更新
        </button>
      </div>
    </header>

    <!-- ── Mobile Tab Bar (hidden on desktop) ───────────────────── -->
    <nav class="mobile-tabs" role="tablist" aria-label="面板切換">
      <button class="mobile-tab-btn active" id="tab-stocks" role="tab" aria-selected="true" aria-controls="sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
          <polyline points="16 7 22 7 22 13"/>
        </svg>
        監控標的
      </button>
      <button class="mobile-tab-btn" id="tab-notes" role="tab" aria-selected="false" aria-controls="sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        分析參數
      </button>
      <button class="mobile-tab-btn" id="tab-report" role="tab" aria-selected="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        報表
      </button>
    </nav>

    <!-- ── Body ───────────────────────────────────────────────────── -->
    <div class="body-layout">

      <!-- Sidebar: Notes -->
      <aside class="sidebar">
        <section class="notes-section" aria-label="分析參數">
          <button class="notes-header" id="notes-toggle" aria-expanded="false" aria-controls="notes-body">
            <span class="notes-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              自訂分析參數
            </span>
            <span class="toggle-icon" aria-hidden="true">▼</span>
          </button>

          <div class="notes-body" id="notes-body" role="region">
            <div class="notes-field">
              <div class="field-header">
                <label for="inventoryInput">庫存現況</label>
                <div class="field-utils">
                  <button class="util-btn clear" id="clear-inventory" title="清空內容">🗑️</button>
                  <button class="util-btn paste" id="paste-inventory" title="貼上剪貼簿">📋</button>
                </div>
              </div>
              <textarea
                id="inventoryInput"
                rows="4"
                placeholder="例如：00757 持有 10 張，均價 65..."
                aria-label="庫存現況備注"></textarea>
            </div>

            <div class="notes-field">
              <div class="field-header">
                <label for="engineMemoInput">引擎二專用備忘錄</label>
                <div class="field-utils">
                  <button class="util-btn clear" id="clear-memo" title="清空內容">🗑️</button>
                  <button class="util-btn paste" id="paste-memo" title="貼上剪貼簿">📋</button>
                </div>
              </div>
              <textarea
                id="engineMemoInput"
                rows="4"
                placeholder="輸入專屬的策略備註或指令..."
                aria-label="引擎二專用備忘錄"></textarea>
            </div>

            <div class="notes-actions">
              <button id="saveNotesBtn" class="btn secondary" aria-label="儲存備注">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                  <polyline points="17 21 17 13 7 13 7 21"/>
                  <polyline points="7 3 7 8 15 8"/>
                </svg>
                儲存
              </button>
              <span id="save-status" class="status-msg" role="status" aria-live="polite"></span>
            </div>
          </div>
        </section>

        <!-- Stock list sidebar (desktop) -->
        <section class="stock-list-panel" aria-label="監控標的">
          <div class="stock-list-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
              <polyline points="16 7 22 7 22 13"/>
            </svg>
            監控標的
          </div>

          <!-- Add stock row -->
          <div class="add-stock-row">
            <input
              type="text"
              id="stock-id-input"
              placeholder="輸入代碼，如 2330"
              maxlength="6"
              autocomplete="off"
              spellcheck="false"
              aria-label="新增股票代碼">
            <button id="add-stock-btn" class="add-btn" aria-label="新增標的">＋</button>
          </div>
          <span id="add-stock-status" class="add-status status-msg" role="status" aria-live="polite"></span>

          <ul class="stock-list" id="stock-list" role="list"></ul>
        </section>
      </aside>

      <!-- Main: Report -->
      <main class="main-content" role="main">
        <div class="progress-bar-wrap" id="progress-wrap" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
          <span class="progress-label" id="progress-label"></span>
        </div>

        <textarea
          id="report-text"
          readonly
          placeholder="點擊「手動更新」開始抓取資料，或等候自動更新..."
          aria-label="股票報表"
          aria-live="polite"></textarea>
      </main>
    </div>

    <!-- ── Footer ─────────────────────────────────────────────────── -->
    <footer class="footer">
      <span id="copy-status" class="status-msg" role="status" aria-live="polite"></span>
      <div class="footer-actions">
        <button id="copy-btn" class="btn secondary" aria-label="複製股票報表">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          複製報表
        </button>
        <button id="copy-gemini-btn" class="btn gemini" aria-label="複製完整 Prompt 供 Gemini 分析">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
          複製供 Gemini 分析
        </button>
      </div>
    </footer>

  </div><!-- /.app-container -->

  <script src="app.js"></script>
</body>
</html>
